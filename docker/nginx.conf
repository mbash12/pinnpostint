events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Logging (Redirect to stdout/stderr for Docker)
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Increase max body size for file uploads (10MB)
    client_max_body_size 10M;

    # Use Docker's built-in DNS resolver for dynamic upstream resolution
    # This prevents nginx from crashing if a backend isn't ready at startup
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ==================== HTTP to HTTPS Redirect ====================
    server {
        listen 80;
        server_name api.pinnpost.com admin.pinnpost.com pinnpost.com www.pinnpost.com;

        # Certbot challenge (must be accessible on HTTP)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ==================== API Server (HTTPS) ====================
    server {
        listen 443 ssl http2;
        server_name api.pinnpost.com;

        ssl_certificate /etc/letsencrypt/live/api.pinnpost.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.pinnpost.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Serve static uploads directly via Nginx
        location /uploads/ {
            alias /app/uploads/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Serve public assets directly via Nginx
        location /public/ {
            alias /app/public/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        location / {
            set $api_upstream http://api:3001;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 120s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /health {
            access_log off;
            set $api_upstream http://api:3001;
            proxy_pass $api_upstream/health;
        }
    }

    # ==================== Admin Panel (HTTPS) ====================
    server {
        listen 443 ssl http2;
        server_name admin.pinnpost.com;

        ssl_certificate /etc/letsencrypt/live/admin.pinnpost.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.pinnpost.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            set $admin_upstream http://admin:3000;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ==================== Mobile Web (HTTPS) ====================
    server {
        listen 443 ssl http2;
        server_name pinnpost.com www.pinnpost.com;

        ssl_certificate /etc/letsencrypt/live/pinnpost.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pinnpost.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            set $mobile_upstream http://mobile:80;
            proxy_pass $mobile_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            set $mobile_upstream http://mobile:80;
            proxy_pass $mobile_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
