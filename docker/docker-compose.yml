services:
  # ==================== DATABASE ====================
  db:
    image: postgres:15-alpine
    container_name: pinn-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pinpost}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backups:/backups
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    # Database access is internal-only through the Compose network. Publishing
    # this port exposed Postgres directly to the Internet.
    # Small-VPS tuning: stay within 384M limit without raising it.
    # Healthcheck uses the same POSTGRES_* vars as the container (no hardcoded user).
    command:
      - "postgres"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=4MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pinn-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: pinn-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Keep enough headroom for Bull + cache. Memory exhaustion produces
          # OOM write errors; READONLY specifically means Redis became a replica.
          cpus: '0.25'
          memory: 512M
    env_file:
      - ../.env
    # No default credential: Compose must fail closed when REDIS_PASSWORD is
    # absent. ACL-deny replication and destructive admin commands. ACLs are
    # preferable to rename-command here because renamed commands cannot be
    # replayed from an existing AOF during recovery.
    command: ["redis-server", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes", "--user", "default", "on", ">${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "~*", "&*", "+@all", "-replicaof", "-slaveof", "-flushall", "-flushdb", "-config", "-module", "-debug"]
    volumes:
      - redis_data:/data
    # Redis is internal-only through the Compose network. Never publish 6379.
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pinn-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== API ====================
  api:
    image: node:20-alpine
    container_name: pinn-api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M
        reservations:
          cpus: '0.3'
          memory: 192M
    working_dir: /app
    env_file:
      - ../.env
    environment:
      # Docker network hostnames
      - REDIS_HOST=redis
      # Keep the legacy URL-based Bull configuration aligned with the rotated
      # component password. REDIS_URL otherwise overrides REDIS_PASSWORD.
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - POSTGRES_HOST=db
      - NODE_ENV=production
    volumes:
      # Mount built code only (no source)
      - ../api/dist:/app/dist
      - ../logs/api:/app/dist/logs   # writable overlay for winston logs
      - ../api/node_modules:/app/node_modules:ro
      - ../api/prisma:/app/prisma:ro
      - ../api/config:/app/config:ro
      - ../api/scripts:/app/scripts:ro
      - ../api/public:/app/public:ro
      - ../api/uploads:/app/uploads
      - ../logs/api:/app/logs
    expose:
      - "${API_PORT:-3001}"
    command: ["node", "--max-old-space-size=400", "dist/src/server.js"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /health/ready includes DB — so a zombie API (up but DB dead) becomes unhealthy
    # and the watchdog can recreate it. Liveness-only /health stays for manual probes.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${API_PORT:-3001}/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pinn-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== ADMIN (Next.js) ====================
  admin:
    image: node:20-alpine
    container_name: pinn-admin
    restart: unless-stopped
    init: true
    user: "node"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.15'
          memory: 128M
    working_dir: /app
    environment:
      - PORT=${ADMIN_PORT:-3000}
      - HOSTNAME=0.0.0.0
      # Must explicitly pass this for Next.js to pick it up
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NODE_ENV=production
    volumes:
      # Mount optimized standalone build
      - ../admin/.next/standalone:/app:ro
      - ../admin/.next/static:/app/.next/static:ro
    expose:
      - "${ADMIN_PORT:-3000}"
    # Use standalone server for better performance and lower memory footprint
    command: ["node", "--max-old-space-size=300", "server.js"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${ADMIN_PORT:-3000}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pinn-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== MOBILE (Static + Nginx) ====================
  mobile:
    image: nginx:alpine
    container_name: pinn-mobile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=16m
      - /var/run:rw,nosuid,nodev,size=1m
    volumes:
      - ../mobile/dist:/usr/share/nginx/html:ro
      - ./nginx-mobile.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - pinn-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== REVERSE PROXY (Nginx) ====================
  nginx:
    image: nginx:alpine
    container_name: pinn-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ../api/uploads:/app/uploads:ro
      - ../api/public:/app/public:ro
    depends_on:
      - api
      - admin
      - mobile
    networks:
      - pinn-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:

networks:
  pinn-network:
    driver: bridge
